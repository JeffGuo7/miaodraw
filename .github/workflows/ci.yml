name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (skip electron download)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
