appId: com.miaodraw.app
productName: 妙绘工作台
directories:
  buildResources: build
files:
  - out/**
extraResources:
  - from: library
    to: library
    filter: ['**/*']
  - from: vendor/bailian-cli.zip
    to: vendor/bailian-cli.zip
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 妙绘工作台
